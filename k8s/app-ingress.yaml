apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockflow-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: stockflow.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173